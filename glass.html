<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planner - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1e3c23 0%, #112214 100%);
      color: #333;
    }

    /* Splash Screen */
    #s {
      position: fixed;
      inset: 0;
      z-index: 99;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #112214;
      color: #fff;
    }
    #s b { font-size: 32px; font-weight: 700; margin-bottom: 16px; letter-spacing: -0.5px; }
    #s i {
      width: 140px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
      border-radius: 3px;
    }
    #s i:after {
      content: "";
      display: block;
      width: 50px;
      height: 100%;
      background: #38BA54;
      animation: l .9s infinite ease-in-out;
      position: absolute;
    }
    @keyframes l { from { left: -50px; } to { left: 140px; } }

    /* Login Card */
    .app {
      width: 100%;
      max-width: 380px;
      background: rgba(255, 255, 255, 0.95);
      padding: 40px 32px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      visibility: hidden;
    }

    .header {
      margin-bottom: 24px;
      text-align: center;
    }
    .header h1 {
      font-size: 24px;
      color: #111;
      font-weight: 700;
    }
    .header p {
      font-size: 14px;
      color: #666;
      margin-top: 4px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: #444;
      margin-bottom: 8px;
      display: block;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .field-group {
      position: relative;
      margin-bottom: 12px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      outline: none;
      transition: all 0.2s ease;
      background: #f8fafc;
    }
    input:focus {
      border-color: #38BA54;
      background: #fff;
    }

    .row.load input { border-color: #eab308; }
    .row.err input { border-color: #ef4444; }
    .row.ok input { border-color: #38BA54; }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      border: none;
      border-radius: 12px;
      background: #cbd5e1;
      color: #64748b;
      font-size: 15px;
      font-weight: 600;
      cursor: not-allowed;
      transition: all 0.2s ease;
    }
    button.ready {
      background: #38BA54;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(56, 186, 84, 0.3);
    }
    button.ready:hover {
      background: #2ea347;
      transform: translateY(-1px);
    }

    .status-msg {
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      display: none;
    }
    .m-typing { background: #fef9c3; color: #854d0e; display: block; border: 1px solid #fef08a; }
    .m-err { background: #fef2f2; color: #991b1b; display: block; border: 1px solid #fecaca; animation: sh .4s; }
    .m-ok { background: #f0fdf4; color: #166534; display: block; border: 1px solid #bbf7d0; }

    @keyframes sh {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }
  </style>
</head>
<body>

  <div id="s"><b>Planner</b><i></i></div>

  <div class="app">
    <div class="header">
      <h1>Acessar conta</h1>
      <p>Digite seu CPF para continuar</p>
    </div>

    <label for="cpf">CPF</label>
    <div class="field-group row" id="r">
      <input id="cpf" placeholder="000.000.000-00" inputmode="numeric" maxlength="11">
    </div>

    <div id="msg" class="status-msg"></div>

    <button id="btn" disabled>ENTRAR</button>
  </div>

  <script>
    const q=s=>document.querySelector(s),nm=v=>v.replace(/\D/g,"").padStart(11,"0"),$c=q("#cpf"),$b=q("#btn"),$m=q("#msg"),$r=q("#r");
    setTimeout(()=>{q("#s").remove();q(".app").style.visibility="visible"},1600);
    const vld=c=>{if(!c||/^(\d)\1+$/.test(c))return 0;return[9,10].every(t=>{let s=0;for(let i=0;i<t;i++)s+=c[i]*(t+1-i);return((s*10)%11)%10==c[t]})};
    const set=(txt,cls,row,ok=0)=>{if(!txt)return $m.style.display="none",$r.className="field-group row";$m.innerHTML=txt;$m.className="status-msg "+cls;$r.className="field-group row "+row;$b.disabled=!ok;$b.classList.toggle("ready",ok)};
    let tm;
    $c.oninput=()=>{
      $c.value=$c.value.replace(/\D/g,"");
      if(tm)clearTimeout(tm);
      const v=$c.value;
      if(!v.length)return set();
      if(v.length<11)return set("✍️ Digitando...","m-typing","load");
      $c.blur();
      if(!vld(nm(v)))return set("❌ CPF inválido","m-err","err");
      set("⏳ Verificando...","m-typing","load");
      tm=setTimeout(async()=>{
        try{
          const r=await fetch("https://default78cbe6a3393942af92f650b4de0e50.d7.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/28/workflows/5be3cad923164dccb4579d27eeb07d8d/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=ovbtM80MKXCBz-uawgOwIs7lnPpEb-OMlP8GzHTz9BE",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({cpf:nm(v)})});
          const d=await r.json(),reg=(d.codigo||[]).find(x=>nm(String(x.CPF2||""))===nm(v));
          if(!reg||!String(reg.ID||"").includes("#"))throw "CPF não localizado ou sem acesso";
          sessionStorage.setItem("preData",JSON.stringify(d));
          set("✅ CPF encontrado","m-ok","ok",1)
        }catch(e){set("❌ "+e,"m-err","err")}
      },400)
    };
    $b.onclick=()=>!$b.disabled&&(sessionStorage.setItem("cpf",nm($c.value)),location.href="mapa/index.html");
  </script>
</body>
</html>
