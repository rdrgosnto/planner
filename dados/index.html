<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Biblioteca de leitura de QR Code -->

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Plus Jakarta Sans',sans-serif;margin:0;display:flex;flex-direction:column;min-height:100vh;background:#fff;-webkit-user-select:none;user-select:none;align-items:center}

/* Cabeçalho alinhado à esquerda como no código original */
#h{position:fixed;top:0;width:100%;height:54px;background:#fff;z-index:1000;box-shadow:0 2px 8px rgba(0,0,0,.1);display:flex;align-items:center;justify-content:flex-start;padding-left:40px;transition:background-color 0.3s ease, color 0.3s ease;}
#h b{font-size:28px;font-weight:800;color:#2d9643;letter-spacing:-.5px;transition:color 0.3s ease;}

/* Caixa da câmera */
.scanner-container { margin-top: 68px; width: 90%; max-width: 260px; background: #fff; padding: 4px; border-radius: 10px; text-align: center; z-index: 100; margin-bottom: 12px; }
.btn-cam { background: #1e40af; color: #fff; border: none; padding: 10px 14px; font-size: 14px; font-weight: 700; border-radius: 8px; cursor: pointer; width: 100%; margin-bottom: 12px; }
#reader { width: 100% !important; border: none !important; border-radius: 8px; overflow: hidden; display: none; background: #000; }
#reader video { width: 100% !important; border-radius: 8px; object-fit: cover; }

#w{display:flex;flex-direction:column;align-items:center;margin-top:10px}
.map-outer{display:flex;flex-direction:column;align-items:flex-start}

.bc{transform:scale(.8);transform-origin:top center;padding:20px;border:3px solid #2d9643;border-radius:16px;position:relative;background:#fff;margin-left:0;}
.g{display:grid;grid-template-columns:repeat(5,54px);gap:14px 10px;justify-content:center}
.s,.e{width:54px;height:54px;display:flex;align-items:center;justify-content:center;border-radius:12px;position:relative}
.s{background:#2d9643;border:3px solid #2d9643;color:#fff;font-weight:700;pointer-events:none}
.s.mine{background:#1e40af!important;border:3px solid #1d4ed8!important;color:#fff!important;box-shadow:0 4px 12px rgba(30,64,175,.35);font-size:14px;gap:2px}
.s.white{background:#fff!important;border:3px solid #cbd5e1!important;color:transparent!important;pointer-events:none}
.s::after{content:"";position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);width:32px;height:14px;border-radius:8px;background:#fff;border:3px solid #2d9643}
.s.mine::after{border-color:#1d4ed8}
.e{pointer-events:none}

/* Botão Limpar */
#btn{width:112px;height:54px;background:#ef4444;color:#fff;border:none;font-size:16px;font-weight:700;border-radius:12px;cursor:pointer;position:absolute;bottom:-64px;right:20px;box-shadow:0 4px 10px rgba(239,68,68,0.3)}
#btn:active{transform:scale(0.95)}
</style>
</head>
<body>

<div id="h"><b id="p1-n">Planner</b></div>

<div class="scanner-container">
  <button class="btn-cam" id="btnCam" onclick="toggleCamera()">📸 Ligar Câmera</button>
  <div id="reader"></div>
</div>

<div id="w">
  <div class="map-outer">
    <div class="bc">
      <div id="wid-div"></div>
      <button id="btn" onclick="limparCheckins()">LIMPAR</button>
    </div>
  </div>
</div>

];

const layoutMap = [
  [ 1, 2, null, 4, 3 ],
  [ 5, 6, null, 8, 7 ],
  [ 9, 10, null, 12, 11 ],
  [ 13, 14, null, 16, 15 ],
  [ 17, 18, null, 20, 19 ],
  [ 21, 22, null, 24, 23 ],
  [ 25, 26, null, 28, 27 ],
  [ 29, 30, null, 32, 31 ],
  [ 33, 34, null, 36, 35 ],
  [ 37, 38, null, 40, 39 ],
  [ 41, 42, null, null, null ]
];

function desenharMapa() {
  const bc = document.querySelector('.bc');
  document.querySelector('.g')?.remove();

  const g = document.createElement('div');
  g.className = 'g';

  layoutMap.forEach(row => {
    row.forEach(v => {
      const e = document.createElement('div');
      if (v === null) {
        e.className = 'e';
      } else {
        e.className = 's';
        const idStr = v.toString().padStart(2, "0");
        e.dataset.s = idStr;
        e.textContent = idStr;

        if (localStorage.getItem(`checkin_${v}`) === 'ok') {
          e.classList.add('mine');
          e.innerHTML = `<span>${idStr}</span><small style="margin-left:2px;font-size:12px">✓</small>`;
        }
      }
      g.appendChild(e);
    });
  });
  bc.insertBefore(g, document.getElementById('btn'));
}

let timeoutFeedback = null;

function processarIngresso(textoLido) {
  textoLido = textoLido.trim();
  if (!textoLido) return;

  // Limpa hífens das pontas caso a câmera corte na leitura
  const lidoLimpo = textoLido.replace(/^-+|-+$/g, "").toLowerCase();

  const aluno = passageiros.find(p => {
    if (!p.qrcode) return false;
    const qrcodeCadastrado = p.qrcode.replace(/^-+|-+$/g, "").toLowerCase();
    let qrcodeMatch = qrcodeCadastrado === lidoLimpo || p.qrcode.toLowerCase() === textoLido.toLowerCase();
    let numIngressoMatch = p.ingresso && p.ingresso.toString() === textoLido.replace(/\D/g, "");
    return qrcodeMatch || numIngressoMatch;
  });

  const header = document.getElementById('h');
  const title = document.getElementById('p1-n');

  if (aluno) {
    const seatId = aluno.poltrona.toString().padStart(2, "0");
    const seatEl = document.querySelector(`[data-s="${seatId}"]`);

    if (seatEl) {
      seatEl.classList.add('mine');
      seatEl.innerHTML = `<span>${seatId}</span><small style="margin-left:2px;font-size:12px">✓</small>`;
      localStorage.setItem(`checkin_${aluno.poltrona}`, 'ok');

      // Barra fica verde e texto branco com o nome do aluno
      header.style.backgroundColor = '#2d9643';
      title.style.color = '#ffffff';
      title.textContent = aluno.nome;

      clearTimeout(timeoutFeedback);
      timeoutFeedback = setTimeout(() => {
        header.style.backgroundColor = '#fff';
        title.style.color = '#2d9643';
        title.textContent = 'Planner';
      }, 3000);
    }
  } else {
    header.style.backgroundColor = '#ef4444';
    title.style.color = '#ffffff';
    title.textContent = '⚠️ Não encontrado';

    clearTimeout(timeoutFeedback);
    timeoutFeedback = setTimeout(() => {
      header.style.backgroundColor = '#fff';
      title.style.color = '#2d9643';
      title.textContent = 'Planner';
    }, 2500);
  }
}

function limparCheckins() {
  if (confirm("Deseja limpar todos os check-ins realizados?")) {
    passageiros.forEach(p => {
      localStorage.removeItem(`checkin_${p.poltrona}`);
    });
    const header = document.getElementById('h');
    const title = document.getElementById('p1-n');
    header.style.backgroundColor = '#fff';
    title.style.color = '#2d9643';
    title.textContent = "Planner";
    desenharMapa();
  }
}

let html5QrCode = null;
let cameraLigada = false;

function toggleCamera() {
  const readerDiv = document.getElementById('reader');
  const btnCam = document.getElementById('btnCam');

  if (!cameraLigada) {
    readerDiv.style.display = 'block';
    btnCam.textContent = '🛑 Desligar Câmera';
    cameraLigada = true;

    html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 20, qrbox: { width: 200, height: 200 } },
      (decodedText) => {
        processarIngresso(decodedText);
      },
      (errorMessage) => {}
    ).catch(err => {
      alert("Erro ao iniciar a câmera: " + err);
      toggleCamera();
    });
  } else {
    if (html5QrCode) {
      html5QrCode.stop().then(() => {
        readerDiv.style.display = 'none';
        btnCam.textContent = '📸 Ligar Câmera';
        cameraLigada = false;
      }).catch(err => { console.log(err); });
    }
  }
}

desenharMapa();
</script>

</html>
