<!-- Biblioteca de leitura de QR Code -->

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Plus Jakarta Sans',sans-serif;margin:0;display:flex;flex-direction:column;min-height:100vh;background:#fff;-webkit-user-select:none;user-select:none;align-items:center}

/* Cabeçalho alinhado à esquerda */
#h{position:fixed;top:0;width:100%;height:54px;background:#fff;z-index:1000;box-shadow:0 2px 8px rgba(0,0,0,.1);display:flex;align-items:center;justify-content:flex-start;padding-left:40px;transition:background-color 0.3s ease, color 0.3s ease;}
#h b{font-size:24px;font-weight:800;color:#2d9643;letter-spacing:-.5px;transition:color 0.3s ease;}

/* Painel de Controle e Câmera */
.scanner-container { margin-top: 64px; width: 90%; max-width: 280px; background: #fff; padding: 6px; border-radius: 10px; text-align: center; z-index: 100; margin-bottom: 8px; }
.btn-cam { background: #1e40af; color: #fff; border: none; padding: 10px 14px; font-size: 14px; font-weight: 700; border-radius: 8px; cursor: pointer; width: 100%; margin-bottom: 8px; }
#reader { width: 100% !important; border: none !important; border-radius: 8px; overflow: hidden; display: none; background: #000; }
#reader video { width: 100% !important; border-radius: 8px; object-fit: cover; }

/* Caixa de busca manual para garantir agilidade se necessário */
.manual-box { display: flex; gap: 6px; width: 100%; margin-bottom: 6px; }
.manual-box input { flex: 1; padding: 8px; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; }
.manual-box input:focus { border-color: #1e40af; }
.manual-box button { background: #2d9643; color: #fff; border: none; padding: 0 12px; font-weight: 700; border-radius: 8px; cursor: pointer; }

#w{display:flex;flex-direction:column;align-items:center;margin-top:5px}
.map-outer{display:flex;flex-direction:column;align-items:flex-start}

.bc{transform:scale(.78);transform-origin:top center;padding:15px;border:3px solid #2d9643;border-radius:16px;position:relative;background:#fff;margin-left:0;}
.g{display:grid;grid-template-columns:repeat(5,54px);gap:12px 10px;justify-content:center}
.s,.e{width:54px;height:54px;display:flex;align-items:center;justify-content:center;border-radius:12px;position:relative;cursor:pointer}
.s{background:#2d9643;border:3px solid #2d9643;color:#fff;font-weight:700}
.s.mine{background:#1e40af!important;border:3px solid #1d4ed8!important;color:#fff!important;box-shadow:0 4px 12px rgba(30,64,175,.35);font-size:14px;gap:2px}
.s.white{background:#fff!important;border:3px solid #cbd5e1!important;color:transparent!important;pointer-events:none}
.s::after{content:"";position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);width:32px;height:14px;border-radius:8px;background:#fff;border:3px solid #2d9643}
.s.mine::after{border-color:#1d4ed8}
.e{pointer-events:none}

/* Botão Limpar */
#btn{width:112px;height:50px;background:#ef4444;color:#fff;border:none;font-size:15px;font-weight:700;border-radius:12px;cursor:pointer;position:absolute;bottom:-58px;right:15px;box-shadow:0 4px 10px rgba(239,68,68,0.3)}
#btn:active{transform:scale(0.95)}
</style>
</head>
<body>

<div id="h"><b id="p1-n">Planner</b></div>

<div class="scanner-container">
  <button class="btn-cam" id="btnCam" onclick="toggleCamera()">📸 Ligar Câmera</button>
  <div id="reader"></div>
  
  <!-- Modo Manual / Ingresso Instantâneo -->
  <div class="manual-box">
    <input type="text" id="txtIngresso" placeholder="Nº Ingresso (ex: 39)" onkeydown="if(event.key==='Enter') processarManual()">
    <button onclick="processarManual()">OK</button>
  </div>
</div>

<div id="w">
  <div class="map-outer">
    <div class="bc">
      <div id="wid-div"></div>
      <button id="btn" onclick="limparCheckins()">LIMPAR</button>
    </div>
  </div>
</div>

const layoutMap = [
  [ 1, 2, null, 4, 3 ],
  [ 5, 6, null, 8, 7 ],
  [ 9, 10, null, 12, 11 ],
  [ 13, 14, null, 16, 15 ],
  [ 17, 18, null, 20, 19 ],
  [ 21, 22, null, 24, 23 ],
  [ 25, 26, null, 28, 27 ],
  [ 29, 30, null, 32, 31 ],
  [ 33, 34, null, 36, 35 ],
  [ 37, 38, null, 40, 39 ],
  [ 41, 42, null, null, null ]
];

function desenharMapa() {
  const bc = document.querySelector('.bc');
  document.querySelector('.g')?.remove();

  const g = document.createElement('div');
  g.className = 'g';

  layoutMap.forEach(row => {
    row.forEach(v => {
      const e = document.createElement('div');
      if (v === null) {
        e.className = 'e';
      } else {
        e.className = 's';
        const idStr = v.toString().padStart(2, "0");
        e.dataset.s = idStr;
        e.textContent = idStr;

        // Permite clique direto na poltrona do mapa para validação manual rápida
        e.onclick = () => marcarCheckinPorPoltrona(v);

        if (localStorage.getItem(`checkin_${v}`) === 'ok') {
          e.classList.add('mine');
          e.innerHTML = `<span>${idStr}</span><small style="margin-left:2px;font-size:12px">✓</small>`;
        }
      }
      g.appendChild(e);
    });
  });
  bc.insertBefore(g, document.getElementById('btn'));
}

let timeoutFeedback = null;

function processarIngresso(textoLido) {
  textoLido = textoLido.trim();
  if (!textoLido) return;

  const apenasDigitos = textoLido.replace(/\D/g, "");
  const numCurto = apenasDigitos ? parseInt(apenasDigitos, 10).toString() : "";

  const aluno = passageiros.find(p => {
    let qrcodeMatch = p.qrcode && p.qrcode.toLowerCase() === textoLido.toLowerCase();
    let ingressoCadastradoLimpo = p.ingresso ? parseInt(p.ingresso, 10).toString() : "";
    let numIngressoMatch = numCurto && ingressoCadastradoLimpo === numCurto;
    return qrcodeMatch || numIngressoMatch;
  });

  if (aluno) {
    marcarCheckinPorPoltrona(aluno.poltrona);
  } else {
    mostrarErro();
  }
}

function processarManual() {
  const input = document.getElementById('txtIngresso');
  const valor = input.value.trim();
  if (!valor) return;
  processarIngresso(valor);
  input.value = '';
  input.focus();
}

function marcarCheckinPorPoltrona(poltronaNum) {
  const aluno = passageiros.find(p => p.poltrona === poltronaNum);
  if (!aluno) return;

  const seatId = poltronaNum.toString().padStart(2, "0");
  const seatEl = document.querySelector(`[data-s="${seatId}"]`);

  if (seatEl) {
    seatEl.classList.add('mine');
    seatEl.innerHTML = `<span>${seatId}</span><small style="margin-left:2px;font-size:12px">✓</small>`;
    localStorage.setItem(`checkin_${poltronaNum}`, 'ok');

    const header = document.getElementById('h');
    const title = document.getElementById('p1-n');
    header.style.backgroundColor = '#2d9643';
    title.style.color = '#ffffff';
    title.textContent = aluno.nome;

    clearTimeout(timeoutFeedback);
    timeoutFeedback = setTimeout(() => {
      header.style.backgroundColor = '#fff';
      title.style.color = '#2d9643';
      title.textContent = 'Planner';
    }, 3000);
  }
}

function mostrarErro() {
  const header = document.getElementById('h');
  const title = document.getElementById('p1-n');
  header.style.backgroundColor = '#ef4444';
  title.style.color = '#ffffff';
  title.textContent = '⚠️ Não encontrado';

  clearTimeout(timeoutFeedback);
  timeoutFeedback = setTimeout(() => {
    header.style.backgroundColor = '#fff';
    title.style.color = '#2d9643';
    title.textContent = 'Planner';
  }, 2500);
}

function limparCheckins() {
  if (confirm("Deseja limpar todos os check-ins realizados?")) {
    passageiros.forEach(p => {
      localStorage.removeItem(`checkin_${p.poltrona}`);
    });
    const header = document.getElementById('h');
    const title = document.getElementById('p1-n');
    header.style.backgroundColor = '#fff';
    title.style.color = '#2d9643';
    title.textContent = "Planner";
    desenharMapa();
  }
}

let html5QrCode = null;
let cameraLigada = false;

function toggleCamera() {
  const readerDiv = document.getElementById('reader');
  const btnCam = document.getElementById('btnCam');

  if (!cameraLigada) {
    readerDiv.style.display = 'block';
    btnCam.textContent = '🛑 Desligar Câmera';
    cameraLigada = true;

    html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 20, qrbox: { width: 200, height: 200 } },
      (decodedText) => {
        processarIngresso(decodedText);
      },
      (errorMessage) => {}
    ).catch(err => {
      alert("Erro ao iniciar a câmera: " + err);
      toggleCamera();
    });
  } else {
    if (html5QrCode) {
      html5QrCode.stop().then(() => {
        readerDiv.style.display = 'none';
        btnCam.textContent = '📸 Ligar Câmera';
        cameraLigada = false;
      }).catch(err => { console.log(err); });
    }
  }
}

desenharMapa();
