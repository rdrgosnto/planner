ibility:hidden;pointer-events:none}.form-box{width:100%;max-width:360px;margin:0 auto}.form-box h3{font-size:26px;color:#0f172a;margin-bottom:8px;font-weight:700;text-align:left}.form-box p{color:#64748b;font-size:14px;margin-bottom:28px;text-align:left}label{font-size:13px;font-weight:700;color:#334155;margin-bottom:8px;display:block;text-transform:uppercase;letter-spacing:.5px;text-align:left}.row{margin-bottom:16px}input{width:100%;padding:14px 16px;font-size:16px;border:2px solid #e2e8f0;border-radius:10px;outline:0;transition:all .2s ease;background:#f8fafc;color:#0f172a}input:focus{border-color:#38BA54;background:#fff;box-shadow:0 0 0 4px rgba(56,186,84,.1)}.row.load input{border-color:#eab308}.row.err input{border-color:#ef4444}.row.ok input{border-color:#38BA54}button{width:100%;padding:14px;border:0;border-radius:10px;background:#cbd5e1;color:#64748b;font-weight:700;font-size:15px;cursor:not-allowed;transition:all .2s ease}button.ready{background:#38BA54;color:#fff;cursor:pointer;box-shadow:0 4px 14px rgba(56,186,84,.3)}button.ready:hover{background:#2f9e47;transform:translateY(-1px)}.status-msg{font-size:13px;padding:12px;border-radius:8px;margin-bottom:16px;display:none;font-weight:500;text-align:left}.m-typing{background:#fef9c3;color:#854d0e;display:block;border:1px solid #fef08a}.m-err{background:#fef2f2;color:#991b1b;display:block;border:1px solid #fecaca;animation:sh .4s}.m-ok{background:#f0fdf4;color:#166534;display:block;border:1px solid #bbf7d0}@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}@media(max-width:768px){.container{justify-content:center;align-items:center}.brand-side{display:none}.form-side{max-width:100%;height:100vh;padding:24px;justify-content:center;align-items:center;transform:translateX(100%)}#s b{font-size:28px}#s i{width:100px}}</style></head><body><div id="s"><b>Planner</b><i></i></div><div class="container"><div class="brand-side"><div><h2>Planner</h2><p>Acesse seu painel e gerencie o mapa de poltronas e reservas de forma simples e organizada.</p></div><span class="copyright">© Planner System</span></div><div class="form-side"><div class="form-box"><h3>Acessar conta</h3><p>Informe seu CPF cadastrado para continuar.</p><label for="cpf">CPF</label><div class="row" id="r"><input id="cpf" placeholder="CPF (somente números)" inputmode="numeric" maxlength="11"></div><div id="msg" class="status-msg"></div><button id="btn" disabled>ENTRAR</button></div></div></div><script>const q=s=>document.querySelector(s),nm=v=>String(v||"").replace(/\D/g,"").padStart(11,"0"),$c=q("#cpf"),$b=q("#btn"),$m=q("#msg"),$r=q("#r");setTimeout(()=>{document.body.classList.add("ready")},1200);const vld=c=>{if(!c||/^(\d)\1+$/.test(c))return 0;return[9,10].every(t=>{let s=0;for(let i=0;i<t;i++)s+=c[i]*(t+1-i);return((s*10)%11)%10==c[t]})};const set=(txt,cls,row,ok=0)=>{if(!txt){$m.style.display="none";$r.className="row";$b.disabled=!0;$b.classList.remove("ready");return}$m.innerHTML=txt;$m.className="status-msg "+cls;$r.className="row "+row;$b.disabled=!ok;$b.classList.toggle("ready",!!ok)};let tm;$c.oninput=()=>{$c.value=$c.value.replace(/\D/g,"");if(tm)clearTimeout(tm);const v=$c.value;if(!v.length)return set();if(v.length<11)return set("✍️ Digitando...","m-typing","load");$c.blur();if(!vld(nm(v)))return set("❌ CPF inválido","m-err","err");set("⏳ Verificando...","m-typing","load");tm=setTimeout(async()=>{try{const r=await fetch("https://default78cbe6a3393942af92f650b4de0e50.d7.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/28/workflows/5be3cad923164dccb4579d27eeb07d8d/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=ovbtM80MKXCBzu9awgOwIs7lnPpEb-OMlP8GzHTz9BE",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({cpf:nm(v)})});if(!r.ok)throw"Erro de resposta da API ("+r.status+")";const d=await r.json(),reg=(d.codigo||[]).find(x=>nm(String(x.CPF2||x.cpf||""))===nm(v));if(!reg||!String(reg.ID||reg.id||"").includes("#"))throw"CPF não localizado ou sem acesso";sessionStorage.setItem("preData",JSON.stringify(d));set("✅ CPF encontrado","m-ok","ok",1)}catch(e){set("❌ "+e,"m-err","err")}},400)};$b.onclick=()=>{!$b.disabled&&(sessionStorage.setItem("cpf",nm($c.value)),location.href="mapa/index.html")};</script></body></html>
