<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planner - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      background: #f8fafc;
    }

    #s {
      position: fixed;
      inset: 0;
      z-index: 99;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #38BA54;
      color: #fff;
    }
    #s b { font-size: 36px; margin-bottom: 12px; }
    #s i { width: 120px; height: 3px; background: rgba(255,255,255,.3); position: relative; overflow: hidden; }
    #s i:after { content:""; display:block; width:40px; height:100%; background:#fff; animation:l .9s infinite; position:absolute }
    @keyframes l{from{left:-40px}to{left:120px}}

    .container {
      display: flex;
      width: 100%;
      min-height: 100vh;
      visibility: hidden;
    }

    .brand-side {
      flex: 1;
      background: linear-gradient(135deg, #2d9643 0%, #1c612b 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 48px;
    }
    .brand-side h2 { font-size: 32px; font-weight: 700; }
    .brand-side p { color: rgba(255,255,255,0.8); margin-top: 12px; max-width: 400px; line-height: 1.5; }

    .form-side {
      width: 100%;
      max-width: 480px;
      background: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 48px;
    }

    .form-box { width: 100%; }
    .form-box h3 { font-size: 24px; color: #0f172a; margin-bottom: 8px; }
    .form-box p { color: #64748b; font-size: 14px; margin-bottom: 24px; }

    label { font-size: 14px; font-weight: 600; color: #334155; margin-bottom: 6px; display: block; }
    .row { margin-bottom: 16px; }
    
    input {
      width: 100%;
      padding: 12px 16px;
      font-size: 16px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      transition: 0.2s;
    }
    input:focus { border-color: #38BA54; box-shadow: 0 0 0 3px rgba(56, 186, 84, 0.15); }

    .row.load input { border-color: #ca8a04; }
    .row.err input { border-color: #dc2626; }
    .row.ok input { border-color: #38BA54; }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #e2e8f0;
      color: #94a3b8;
      font-weight: 600;
      font-size: 15px;
      cursor: not-allowed;
      transition: 0.2s;
    }
    button.ready { background: #38BA54; color: #fff; cursor: pointer; }
    button.ready:hover { background: #2f9e47; }

    .status-msg {
      font-size: 13px;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 16px;
      display: none;
    }
    .m-typing { background: #fef9c3; color: #713f12; display: block; }
    .m-err { background: #fef2f2; color: #991b1b; display: block; animation: sh .4s; }
    .m-ok { background: #f0fdf4; color: #166534; display: block; }

    @keyframes sh { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }

    @media (max-width: 768px) {
      .brand-side { display: none; }
      .form-side { max-width: 100%; }
    }
  </style>
</head>
<body>

  <div id="s"><b>Planner</b><i></i></div>

  <div class="container app">
    <div class="brand-side">
      <h2>Planner</h2>
      <p>Gerencie seus mapas e fluxos de forma organizada e eficiente em uma plataforma centralizada.</p>
      <span style="font-size: 12px; opacity: 0.6;">© Planner System</span>
    </div>
    <div class="form-side">
      <div class="form-box">
        <h3>Entrar na plataforma</h3>
        <p>Informe seus dados de acesso corporativo.</p>

        <label for="cpf">CPF do Usuário</label>
        <div class="row" id="r">
          <input id="cpf" placeholder="000.000.000-00" inputmode="numeric" maxlength="11">
        </div>

        <div id="msg" class="status-msg"></div>

        <button id="btn" disabled>CONTINUAR</button>
      </div>
    </div>
  </div>

  <script>
    const q=s=>document.querySelector(s),nm=v=>v.replace(/\D/g,"").padStart(11,"0"),$c=q("#cpf"),$b=q("#btn"),$m=q("#msg"),$r=q("#r");
    setTimeout(()=>{q("#s").remove();q(".app").style.visibility="visible"},1600);
    const vld=c=>{if(!c||/^(\d)\1+$/.test(c))return 0;return[9,10].every(t=>{let s=0;for(let i=0;i<t;i++)s+=c[i]*(t+1-i);return((s*10)%11)%10==c[t]})};
    const set=(txt,cls,row,ok=0)=>{if(!txt)return $m.style.display="none",$r.className="row";$m.innerHTML=txt;$m.className="status-msg "+cls;$r.className="row "+row;$b.disabled=!ok;$b.classList.toggle("ready",ok)};
    let tm;
    $c.oninput=()=>{
      $c.value=$c.value.replace(/\D/g,"");
      if(tm)clearTimeout(tm);
      const v=$c.value;
      if(!v.length)return set();
      if(v.length<11)return set("✍️ Digitando...","m-typing","load");
      $c.blur();
      if(!vld(nm(v)))return set("❌ CPF inválido","m-err","err");
      set("⏳ Verificando...","m-typing","load");
      tm=setTimeout(async()=>{
        try{
          const r=await fetch("https://default78cbe6a3393942af92f650b4de0e50.d7.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/28/workflows/5be3cad923164dccb4579d27eeb07d8d/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=ovbtM80MKXCBz-uawgOwIs7lnPpEb-OMlP8GzHTz9BE",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({cpf:nm(v)})});
          const d=await r.json(),reg=(d.codigo||[]).find(x=>nm(String(x.CPF2||""))===nm(v));
          if(!reg||!String(reg.ID||"").includes("#"))throw "CPF não localizado ou sem acesso";
          sessionStorage.setItem("preData",JSON.stringify(d));
          set("✅ CPF encontrado","m-ok","ok",1)
        }catch(e){set("❌ "+e,"m-err","err")}
      },400)
    };
    $b.onclick=()=>!$b.disabled&&(sessionStorage.setItem("cpf",nm($c.value)),location.href="mapa/index.html");
  </script>
</body>
</html>
